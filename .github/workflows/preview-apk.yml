name: Preview APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:assemblePreview -Pfdroid=false --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: note-chat-preview-apk
          path: android/app/build/outputs/apk/preview/*.apk
          retention-days: 14
